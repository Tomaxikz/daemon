name: Build, Test and Release

on:
  push:
    branches: [develop]
    tags: ['v*']
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Test and build Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Verify modules
        run: |
          go mod download
          go mod verify
      - name: Test
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: go test -mod=readonly ./...
      - name: Race test
        env:
          CGO_ENABLED: '1'
          GOTOOLCHAIN: local
        run: go test -race -mod=readonly ./...
      - name: Build and smoke-test release binaries
        env:
          BUILD_ARCH: ${{ matrix.arch }}
        run: python3 .github/scripts/release.py build --arch "$BUILD_ARCH" --directory dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wings-linux-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          overwrite: true

  installers:
    name: Validate ${{ matrix.addon }} distribution
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        addon: [betterfiles, betterconsole, networkstats, full]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
      - name: Test release tooling
        if: matrix.addon == 'full'
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check shell syntax
        run: |
          bash -n betterfiles_patch.sh
          bash -n betterconsolepatch.sh
          bash -n install_networkstats.sh
      - name: Validate patches, clean installs, upgrades and repeat runs
        env:
          ADDON: ${{ matrix.addon }}
        run: python3 .github/scripts/validate_installers.py "$ADDON"

  bundle:
    name: Assemble verified release bundle
    needs: [build-and-test, installers]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          pattern: wings-linux-*
          merge-multiple: true
          path: dist
      - name: Pin installer sources and generate checksums
        run: python3 .github/scripts/release.py bundle --directory dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wings-release-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish:
    name: Publish verified release
    needs: bundle
    if: >-
      github.repository == 'Tomaxikz/daemon' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: wings-release-publisher
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: wings-release-${{ github.sha }}
          path: dist
      - name: Publish snapshot, then promote the development alias
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release.py publish --directory dist
